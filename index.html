<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Opt out of mobile browsers' forced dark mode; the app has its own theme
         toggle (AppContext swaps this to the CSS color-scheme per theme). -->
    <meta name="color-scheme" content="only light" />
    <meta name="theme-color" content="#f7f4ee" />
    <title>رُقعة — نادي القراءة | Ruqʿa — Reading Club</title>
    <meta name="description" content="نادي «رُقعة» للقراءة — ملخّصاتٌ تفاعلية ثنائية اللغة للكتب التي نقرؤها، من صنع الأعضاء وغير مرتبطة بالمؤلّفين أو دور النشر." />

    <!-- Link previews, for when a member drops the site into the club group.
         og:image must be ABSOLUTE — WhatsApp/Facebook scrapers won't fetch a
         relative one. Points at the live Vercel URL; update if a custom domain
         is added. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="رُقعة — Ruqʿa" />
    <meta property="og:url" content="https://ruqaa.vercel.app/" />
    <meta property="og:title" content="رُقعة — نادي القراءة | Ruqʿa — Reading Club" />
    <meta property="og:description" content="نادي قراءةٍ نلتقي فيه أسبوعياً من ستّ دول — ملخّصاتٌ تفاعلية ثنائية اللغة، ودراساتٌ على هيئة لعبة، وتقييماتٌ تجرّبها بنفسك." />
    <meta property="og:image" content="https://ruqaa.vercel.app/images/club/reading-corner.jpg" />
    <meta property="og:image:alt" content="كوبُ شايٍ وكتابٌ مفتوح ونظّارةٌ على غطاءٍ صوفيّ" />
    <meta property="og:locale" content="ar_AR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="رُقعة — نادي القراءة | Ruqʿa — Reading Club" />
    <meta name="twitter:description" content="نادي قراءةٍ نلتقي فيه أسبوعياً من ستّ دول — ملخّصاتٌ تفاعلية ثنائية اللغة." />
    <meta name="twitter:image" content="https://ruqaa.vercel.app/images/club/reading-corner.jpg" />

    <!-- No font <link> here on purpose. The webfonts are self-hosted: the
         @font-face rules live in src/styles/fonts.css and the woff2 files in
         src/styles/fonts/, both generated by scripts/fetch-fonts.mjs. That
         removes two preconnects and a render-blocking cross-origin stylesheet
         from the critical path, keeps the site working where Google Fonts is
         slow or blocked, and stops handing every visitor's IP to a third
         party. Weights are 400/500/600/700 — see the Fonts section in
         CLAUDE.md before adding one. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
